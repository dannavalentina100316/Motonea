<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Motonea</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="body-login">

    <div class="login-page">
        <div class="login-visual">
            <div class="hero-badge">Moto Premium</div>
            <div class="visual-brand">
                <span class="brand-mark">M</span>
                <span>Motonea</span>
            </div>
            <div class="hero-text">
                <p>Tu próximo</p>
                <h1>Ride</h1>
                <h2>inspirado</h2>
            </div>
        </div>

        <div class="auth-card">
            <div class="login-header">
                <span class="eyebrow">Acceso al taller</span>
                <h2>Inicia sesión</h2>
                <p>Gestiona reservas, servicios y clientes.</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" required placeholder="tu.correo@motonea.com">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>

                <div id="error-message" class="error-hidden"></div>

                <button type="submit" class="btn-primary">Iniciar Sesión</button>
            </form>

            <div class="login-footer">
                <p>¿No tienes cuenta? <a href="register.html">Regístrate aquí</a></p>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
